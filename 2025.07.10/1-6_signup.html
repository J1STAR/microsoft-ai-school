<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <main>
      <h1>회원가입을 환영합니다</h1>
      <form action="">
        <fieldset>
          <legend>사용자 정보</legend>
          <div class="row">
            <label for="name">아이디</label>
            <input
              type="text"
              id="name"
              name="name"
              minlength="4"
              maxlength="10"
              placeholder="4자~10자 사이, 공백없이"
              required
            />
          </div>
          <div class="row">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="row">
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="문자와 숫자, 특수기호 포함"
              required
            />
          </div>
          <div class="row">
            <label for="password2">비밀번호 확인</label>
            <input type="password" id="password2" name="password2" required />
          </div>
          <div class="row">
            <label for="route">가입경로</label>
            <select id="route" name="route">
              <option value="0" selected>블로그</option>
              <option value="1">광고</option>
              <option value="2">검색</option>
              <option value="3">지인추천</option>
              <option value="4">기타</option>
            </select>
          </div>
          <div class="row">
            <label for="memo">메모</label>
            <textarea
              id="memo"
              name="memo"
              placeholder="남길 말씀이 있다면 여기에"
            ></textarea>
          </div>
        </fieldset>
        <fieldset>
          <legend>이벤트와 새로운 소식</legend>
          <label>
            <input type="radio" name="newsletter" value="yes" required />메일
            수신
          </label>
          <label>
            <input type="radio" name="newsletter" value="no" required />메일
            수신 안함
          </label>
        </fieldset>
        <div class="center">
          <button class="btn" type="submit">가입하기</button>
          <button class="btn" type="reset">취소</button>
        </div>
      </form>
    </main>
  </body>
</html>
