    <title>갤러리</title>
    <style>
      h1 {
        text-align: center;
      }
      body {
        text-align: center;
      }
      #container {
        display: grid;
        grid-template-columns: 1fr;
      }
      img {
        width: 400px;
      }

      @media screen and (min-width: 480px) {
        #container {
          grid-template-columns: repeat(3, 1fr);
        }
        img {
          width: 200px;
        }
      }
    </style>
  </head>

    <h1>갤러리</h1>
    <div id="container">
      <div class="box">

            src="https://cdn.pixabay.com/photo/2018/04/13/16/13/pixel-3316924_1280.png"
            alt="고흐"
          />
        </div>
        <div class="title">고흐</div>
      </div>
